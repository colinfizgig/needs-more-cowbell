<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4e4">
  <title>Needs More Cowbell</title>
  <meta name="description" content="A sudoku-meets-minesweeper logic puzzle starring Cowbell the Pithuskahula.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M7.5 4.5H16.5L19.5 17.5Q19.5 19 18 19H6Q4.5 19 4.5 17.5Z' fill='%23e0b13a' stroke='%236b4a10' stroke-width='1.4'/%3E%3Ccircle cx='12' cy='20.6' r='1.7' fill='%233a2a1f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Home -->
    <section id="screen-home" class="screen active" aria-label="Home">
      <header class="topbar">
        <div class="wallet" data-wallet></div>
        <button class="icon-btn" id="btn-settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </header>

      <div class="hero">
        <h1 class="logo"><small>Needs More</small><span>Cowbell</span></h1>
        <p class="tagline">starring Cowbell the Pithuskahula</p>
        <div class="mascot-wrap">
          <div class="bubble" id="home-bubble">Wanna play?</div>
          <button class="mascot" id="home-mascot" aria-label="Pet Cowbell"></button>
        </div>
      </div>

      <div class="menu">
        <button class="btn primary big" id="btn-play">
          <span class="btn-title" id="play-title">Play</span>
          <span class="btn-sub" id="play-sub"></span>
        </button>
        <button class="btn sky" id="btn-daily">
          <span class="btn-title">Daily Walk</span>
          <span class="btn-sub" id="daily-sub"></span>
        </button>
        <div class="menu-row">
          <button class="btn" id="btn-closet">Closet</button>
          <button class="btn" id="btn-scores">Scoreboard</button>
          <button class="btn" id="btn-help">How to play</button>
        </div>
      </div>
    </section>

    <!-- Game -->
    <section id="screen-game" class="screen" aria-label="Puzzle">
      <header class="game-top">
        <button class="icon-btn" id="btn-back" aria-label="Back to home">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="game-title">
          <div id="game-name">Stage 1</div>
          <div class="game-meta"><span id="timer">0:00</span><span class="par" id="par"></span></div>
        </div>
        <div class="hearts" id="hearts" aria-label="Hearts left"></div>
      </header>

      <div class="coach">
        <div class="coach-dog" id="coach-dog"></div>
        <div class="coach-bubble" id="coach-text" aria-live="polite"></div>
      </div>

      <div class="board-wrap">
        <div id="board" role="grid" aria-label="Puzzle board"></div>
      </div>

      <div class="tools">
        <button class="tool" id="btn-undo" aria-label="Undo mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          <span>Undo</span>
        </button>
        <button class="tool" id="btn-mode" aria-label="Switch tap mode">
          <span class="mode-icon" id="mode-icon"></span>
          <span id="mode-label">Mark</span>
        </button>
        <button class="tool hint" id="btn-hint" aria-label="Hint">
          <span class="mode-icon" id="hint-icon"></span>
          <span id="hint-label">Hint</span>
        </button>
        <button class="tool cowbell" id="btn-cowbell" aria-label="More Cowbell: reveal a pup">
          <span class="mode-icon" id="cowbell-icon"></span>
          <span id="cowbell-label">Cowbell</span>
        </button>
        <button class="tool" id="btn-clear" aria-label="Clear marks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>
          <span>Clear ✕</span>
        </button>
      </div>
      <p class="controls-tip" id="controls-tip"></p>
    </section>
  </div>

  <div class="modal-backdrop hidden" id="modal" role="dialog" aria-modal="true">
    <div class="modal" id="modal-body"></div>
  </div>
  <div id="confetti" aria-hidden="true"></div>
  <div id="toast" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/puzzle.js"></script>
  <script src="js/art.js"></script>
  <script src="js/scores.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
